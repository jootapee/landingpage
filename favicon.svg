<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0A192F" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- JPRA Monogram - Playfair Display style -->
  <text x="50" y="68" font-family="Georgia, serif" font-weight="bold" font-size="52" 
        fill="#D4AF37" text-anchor="middle" dominant-baseline="central" 
        letter-spacing="-2px">JPRA</text>
  
  <!-- Subtle accent line -->
